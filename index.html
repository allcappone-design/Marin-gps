<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARIN GPS</title><style>
:root{--green:#39ff14;--orange:#ff5a00;--purple:#e51cff}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--green);font-family:Arial,Helvetica,sans-serif;font-weight:600}main{max-width:850px;margin:auto;padding:18px 14px 55px}h1{text-align:center;font-size:27px;margin:12px 0 20px}.language{margin-bottom:14px}select,input,textarea{background:#050505;color:var(--green);border:3px solid var(--green);border-radius:13px;padding:14px;font:inherit;width:100%;outline:none}select{width:auto;color:#f177c8}input::placeholder{color:#f177c8;opacity:1}.frame{border:4px solid #ff8000;box-shadow:0 0 8px #ff5a00,0 0 18px #ff5a00,inset 0 0 5px #ff5a00;border-radius:23px;padding:18px;margin:18px 0 24px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button{background:var(--orange);border:0;border-radius:14px;color:var(--green);font-size:17px;font-weight:800;padding:16px 12px;cursor:pointer;min-height:52px}button:active{filter:brightness(1.25)}.buttons button{flex:1}p{line-height:1.35}label{display:block;margin:18px 0 8px}textarea{height:110px;resize:vertical;color:var(--purple)}#commentsLabel{color:var(--purple)}#coords{color:#f177c8}#clients{margin-top:14px}.client{padding:12px 0;border-bottom:1px solid #327c24}.client strong{display:block;font-size:18px;overflow-wrap:anywhere}.client small{display:block;color:#c8ffc0;margin:7px 0}.client .buttons{margin:8px 0}.client button{font-size:14px;min-height:40px;padding:9px}#message{font-size:14px}#mapPanel{display:none}#map{height:60vh;min-height:320px;background:#171717;border:2px solid var(--green);border-radius:12px}#mapPanel.open{display:block}#editPanel{display:none}#editPanel.open{display:block}.muted{font-size:14px;font-weight:500}.hidden{display:none!important}@media(max-width:420px){.frame{padding:14px}button{font-size:15px}h1{font-size:23px}}
</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><main><h1>MARIN GPS</h1><div class="language"><select id="lang" aria-label="Language"><option value="ro">Română</option><option value="de">Deutsch</option><option value="pl">Polski</option><option value="ru">Русский</option><option value="en">English</option></select></div><section class="frame"><input id="search" placeholder="Caută nume sau cod"><div class="buttons"><button id="importBtn">📁 Importă KML</button><button id="addBtn">+ Adaugă client</button></div><input id="kmlFile" class="hidden" type="file" accept=".kml,application/vnd.google-earth.kml+xml,text/xml,application/xml"><div class="buttons"><button id="mapBtn">🗺️ Hartă / Google Maps</button></div><p id="status"></p><p id="message" class="muted"></p><div id="clients"></div></section><section id="mapPanel" class="frame"><div class="buttons"><button id="closeMap">✕</button><button id="openGoogle">Google Maps ↗</button></div><p id="mapHint" class="muted"></p><div id="map"></div></section><section id="editPanel" class="frame"><h2 id="formTitle">Client</h2><label id="nameLabel" for="name">Nume / cod</label><input id="name" autocomplete="off"><label id="coordsLabel" for="coords">Coordonate GPS — o singură rubrică (lipește din Google Maps)</label><input id="coords" placeholder="52.123456, 8.123456"><label id="commentsLabel" for="comments">Comentarii</label><textarea id="comments"></textarea><div class="buttons"><button id="saveBtn">Salvează</button><button id="cancelBtn">Anulează</button></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const dict={ro:['Caută nume sau cod','📁 Importă KML','+ Adaugă client','🗺️ Hartă / Google Maps','Client','Nume / cod','Coordonate GPS — o singură rubrică (lipește din Google Maps)','Comentarii','Salvează','Anulează','Atinge harta pentru a selecta coordonatele și a adăuga clientul.','Nu sunt clienți. Importă un KML sau adaugă manual.','Clienți: ','Datele sunt salvate local pe acest dispozitiv. Pentru sincronizare între telefoane este necesar un server.','Navighează','Editează','Șterge','Import finalizat: ','Nu s-au găsit puncte în KML.','Introdu numele și coordonatele valide.','Confirmi ștergerea clientului?','Eroare la import: '],de:['Name oder Code suchen','📁 KML importieren','+ Kunde hinzufügen','🗺️ Karte / Google Maps','Kunde','Name / Code','GPS-Koordinaten — ein Feld (aus Google Maps einfügen)','Kommentare','Speichern','Abbrechen','Karte antippen, um Koordinaten zu wählen.','Keine Kunden. KML importieren oder hinzufügen.','Kunden: ','Daten werden lokal gespeichert. Für Synchronisierung ist ein Server nötig.','Navigieren','Bearbeiten','Löschen','Importiert: ','Keine Punkte in KML gefunden.','Name und gültige Koordinaten eingeben.','Kunde löschen?','Importfehler: '],pl:['Szukaj nazwy lub kodu','📁 Importuj KML','+ Dodaj klienta','🗺️ Mapa / Google Maps','Klient','Nazwa / kod','Współrzędne GPS — jedno pole (wklej z Google Maps)','Komentarze','Zapisz','Anuluj','Dotknij mapy, aby wybrać współrzędne.','Brak klientów. Zaimportuj KML lub dodaj ręcznie.','Klienci: ','Dane są zapisane lokalnie. Synchronizacja wymaga serwera.','Nawiguj','Edytuj','Usuń','Zaimportowano: ','Nie znaleziono punktów KML.','Wpisz nazwę i prawidłowe współrzędne.','Usunąć klienta?','Błąd importu: '],ru:['Поиск по имени или коду','📁 Импорт KML','+ Добавить клиента','🗺️ Карта / Google Maps','Клиент','Имя / код','GPS-координаты — одно поле (вставьте из Google Maps)','Комментарии','Сохранить','Отмена','Нажмите на карту, чтобы выбрать координаты.','Клиентов нет. Импортируйте KML или добавьте вручную.','Клиентов: ','Данные хранятся на этом устройстве. Для синхронизации нужен сервер.','Маршрут','Изменить','Удалить','Импортировано: ','Точки KML не найдены.','Введите имя и корректные координаты.','Удалить клиента?','Ошибка импорта: '],en:['Search name or code','📁 Import KML','+ Add client','🗺️ Map / Google Maps','Client','Name / code','GPS coordinates — one field (paste from Google Maps)','Comments','Save','Cancel','Tap the map to select coordinates.','No clients. Import KML or add manually.','Clients: ','Data is stored locally on this device. Sync between phones requires a server.','Navigate','Edit','Delete','Imported: ','No KML points found.','Enter a name and valid coordinates.','Delete client?','Import error: ']};let lang='ro',editing=null,items=[],map,marker,selected=null;const t=i=>dict[lang][i];try{const a=JSON.parse(localStorage.getItem('marin_gps_clients_v2')||'[]');if(Array.isArray(a))items=a}catch(e){}function persist(){try{localStorage.setItem('marin_gps_clients_v2',JSON.stringify(items));return true}catch(e){alert('Spațiul local este plin. Exportă datele înainte de a continua.');return false}}function valid(s){const m=String(s).match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(!m)return null;const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null}function translate(){const pairs=[['search',0,'placeholder'],['importBtn',1],['addBtn',2],['mapBtn',3],['formTitle',4],['nameLabel',5],['coordsLabel',6],['commentsLabel',7],['saveBtn',8],['cancelBtn',9],['mapHint',10]];pairs.forEach(([id,i,attr])=>attr?$(id)[attr]=t(i):$(id).textContent=t(i));$('message').textContent=t(13);render()}function render(){const q=$('search').value.trim().toLocaleLowerCase(),box=$('clients');box.replaceChildren();$('status').textContent=items.length?t(12)+items.length:t(11);items.filter(x=>(x.name+' '+(x.code||'')).toLocaleLowerCase().includes(q)).forEach(x=>{const row=document.createElement('div');row.className='client';const name=document.createElement('strong');name.textContent='◉ '+x.name+(x.code?' · '+x.code:'');row.append(name);if(x.coords){const small=document.createElement('small');small.textContent=x.coords;row.append(small)}if(x.comments){const small=document.createElement('small');small.textContent=x.comments;row.append(small)}const bar=document.createElement('div');bar.className='buttons';[[t(14),()=>{const p=valid(x.coords);if(p)window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.join(',')),'_blank');else alert(t(19))}],[t(15),()=>showForm(x)],[t(16),()=>{if(confirm(t(20))){items=items.filter(z=>z.id!==x.id);persist();render()}}]].forEach(([label,action])=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;bar.append(b)});row.append(bar);box.append(row)})}function showForm(x){editing=x?x.id:null;$('name').value=x?x.name:'';$('coords').value=x?x.coords:'';$('comments').value=x?x.comments:'';$('editPanel').classList.add('open');$('editPanel').scrollIntoView({behavior:'smooth',block:'start'})}function save(){const name=$('name').value.trim(),coords=$('coords').value.trim(),comments=$('comments').value.trim();if(!name||!valid(coords)){alert(t(19));return}const obj={id:editing||String(Date.now())+Math.random(),name,coords,comments};if(editing){items=items.map(x=>x.id===editing?obj:x)}else items.unshift(obj);persist();$('editPanel').classList.remove('open');render()}function parseKml(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML invalid');const nodes=[...doc.getElementsByTagName('*')].filter(n=>n.localName==='Placemark');let count=0;for(const node of nodes){const descendants=[...node.getElementsByTagName('*')];const find=tag=>descendants.find(n=>n.localName===tag)?.textContent?.trim()||'';const name=find('name')||'Client',description=find('description');const point=descendants.find(n=>n.localName==='Point');if(!point)continue;const coordsNode=[...point.getElementsByTagName('*')].find(n=>n.localName==='coordinates');const raw=coordsNode?.textContent?.trim().split(/\s+/)[0];if(!raw)continue;const parts=raw.split(',');const coords=parts.length>=2?parts[1]+', '+parts[0]:'';if(!valid(coords))continue;const exists=items.some(x=>x.name===name&&x.coords===coords);if(!exists){items.push({id:String(Date.now())+Math.random(),name,coords,comments:description.replace(/<[^>]*>/g,' ').trim()});count++}}return count}function openMap(){if(!window.L){alert('Harta necesită conexiune la internet.');return}$('mapPanel').classList.add('open');if(!map){map=L.map('map').setView([51,10],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);map.on('click',e=>{selected=[e.latlng.lat,e.latlng.lng];if(marker)marker.remove();marker=L.marker(selected).addTo(map);showForm();$('coords').value=selected.map(n=>n.toFixed(6)).join(', ')})}setTimeout(()=>map.invalidateSize(),80);$('mapPanel').scrollIntoView({behavior:'smooth'})} $('lang').onchange=e=>{lang=e.target.value;translate()};$('search').oninput=render;$('addBtn').onclick=()=>showForm();$('saveBtn').onclick=save;$('cancelBtn').onclick=()=>$('editPanel').classList.remove('open');$('importBtn').onclick=()=>{$('kmlFile').value='';$('kmlFile').click()};$('kmlFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const count=parseKml(await f.text());persist();render();alert(count?t(17)+count:t(18))}catch(err){alert(t(21)+err.message)}};$('mapBtn').onclick=openMap;$('closeMap').onclick=()=>$('mapPanel').classList.remove('open');$('openGoogle').onclick=()=>window.open('https://www.google.com/maps','_blank');translate()})();
</script></body></html>
