=>dict[$('lang').value][i];function translate(){$('subtitle').textContent=t(0);$('search').placeholder=t(1);$('import').textContent='📂 '+t(2);$('add').textContent='+ '+t(3);$('save').textContent=t(4);$('cancel').textContent=t(5);$('descLabel').firstChild.textContent=t(6);$('note').textContent=t(11);render()}$('lang').onchange=translate;function persist(){try{localStorage.setItem(key,JSON.stringify(clients));return true}catch(e){alert('Stocarea locală nu este disponibilă. Deschide fișierul în Safari sau Chrome.');return false}}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.trim().toLocaleLowerCase();let matches=clients.map((c,i)=>({...c,i})).filter(c=>(c.name+' '+(c.code||'')).toLocaleLowerCase().includes(q));$('count').textContent=matches.length+' '+t(7);$('results').innerHTML=matches.slice(0,limit).map(c=>`<div class="item"><strong>${escapeHTML(c.name)}</strong><div class="muted">${escapeHTML(c.desc||'')}</div><small>${c.lat}, ${c.lon}</small><div class="actions"><button data-act="choose" data-id="${c.i}">🧭 ${t(8)}</button><button data-act="edit" data-id="${c.i}">✏️ ${t(9)}</button><button data-act="delete" data-id="${c.i}">🗑</button></div></div>`).join('');$('more').style.display=matches.length>limit?'block':'none'}$('search').oninput=()=>{limit=60;render()};$('more').onclick=()=>{limit+=60;render()};$('results').onclick=e=>{let b=e.target.closest('button[data-act]');if(!b)return;let i=Number(b.dataset.id),c=clients[i];if(b.dataset.act==='choose')showNav(c);if(b.dataset.act==='edit')openEditor(i);if(b.dataset.act==='delete'&&confirm(t(10))){clients.splice(i,1);persist();render()}};
function showNav(c){

function openEditor(i){editing=i;let c=i===null?{name:'',lat:'',lon:'',desc:''}:clients[i];$('name').value=c.name??'';$('coords').value=(c.lat!==''&&c.lon!=='')?c.lat+', '+c.lon:'';$('desc').value=c.desc??'';$('editor').style.display='block';$('editor').scrollIntoView({behavior:'smooth'})}$('add').onclick=()=>openEditor(null);$('cancel').onclick=()=>$('editor').style.display='none';$('save').onclick=()=>{let name=$('name').value.trim(),parts=$('coords').value.trim().replace(/[°]/g,'').match(/^\s*([+-]?\d+(?:[.,]\d+)?)\s*[,;\s]+\s*([+-]?\d+(?:[.,]\d+)?)\s*$/),lat=parts?Number(parts[1].replace(',','.')):NaN,lon=parts?Number(parts[2].replace(',','.')):NaN;if(!name||!parts||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){alert('Verifică numele și coordonatele GPS.');return}let c={name,lat,lon,desc:$('desc').value};if(editing===null)clients.push(c);else clients[editing]=c;if(persist()){$('editor').style.display='none';render()}};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let xml=new DOMParser().parseFromString(await f.text(),'application/xml');if(xml.getElementsByTagName('parsererror').length)throw Error('KML invalid');let nodes=[...xml.getElementsByTagName('*')].filter(x=>x.localName==='Placemark'),incoming=[];function child(el,name){return [...el.getElementsByTagName('*')].find(x=>x.localName===name)?.textContent?.trim()||''}for(let p of nodes){let name=child(p,'name'),point=[...p.getElementsByTagName('*')].find(x=>x.localName==='Point');if(!point)continue;let co=child(point,'coordinates').split(/\s+/)[0].split(','),lon=Number(co[0]),lat=Number(co[1]);if(name&&Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)incoming.push({name,lat,lon,desc:child(p,'description')})}if(!incoming.length)throw Error('Nu am găsit clienți cu coordonate.');let seen=new Set(clients.map(c=>[c.name,c.lat,c.lon].join('|'))),added=0;for(let c of incoming){let id=[c.name,c.lat,c.lon].join('|');if(!seen.has(id)){clients.push(c);seen.add(id);added++}}if(persist()){$('status').textContent='KML: '+incoming.length+' clienți găsiți; '+added+' adăugați.';limit=60;render()}}catch(err){alert('Import nereușit: '+err.message)}finally{e.target.value=''}};translate();
